apiVersion: v1
kind: Pod

metadata:
  name: memory-test

spec:
  containers:
    - name: memory-test
      image: python:3.12-slim

      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "32Mi"

      command:
        - python
        - -c
        - |
          x = bytearray(100 * 1024 * 1024)
          print("Allocated 100MB")
          import time
          time.sleep(300)